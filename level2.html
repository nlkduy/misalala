<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>MisaLala - Level 2</title>
		<link rel="stylesheet" href="style/level.css" type="text/css">
		<link rel="icon" href="facvicon.png" type="image/gif">
	</head>

	<body>
		<div class="game-container level-2">
			<aside class="reference-images">
				<h3>Reference Images</h3>
				<div class="reference-grid">
					<img src="img/dog/one.jpg" alt="Reference 1" class="reference-img">
					<img src="img/dog/two.jpg" alt="Reference 2" class="reference-img">
					<img src="img/dog/three.jpg" alt="Reference 3" class="reference-img">
					<img src="img/dog/four.jpg" alt="Reference 4" class="reference-img">
					<img src="img/dog/five.jpg" alt="Reference 5" class="reference-img">
					<img src="img/dog/six.jpg" alt="Reference 6" class="reference-img">
					<img src="img/dog/seven.jpg" alt="Reference 7" class="reference-img">
					<img src="img/dog/eight.jpg" alt="Reference 8" class="reference-img">
				</div>
			</aside>

			<main class="game-area">
				<div id="game-grid" class="game-grid"></div>
			</main>

			<aside class="game-stats">
				<div class="logo-container">
					<a href="index.html" class="misalala-logo-text">MISALALA</a>
				</div>
				<h2 id="level">Level 2</h2>
				<div class="divider"></div>
				<div class="stat">
					<span class="stat-label">Time:</span>
					<span class="stat-value" id="timer">60s</span>
				</div>
				<div class="stat">
					<span class="stat-label">Score:</span>
					<span class="stat-value" id="score">0</span>
				</div>
				<div id="status" class="game-status"></div>
				<button id="playagain" class="btn-play-again">Play Again</button>
				<footer class="game-footer">
					<p>&copy; 2017-2026 by DuyNLK</p>
				</footer>
			</aside>
		</div>

		<div id="score-popup"></div>

		<script src="script/Game.js"></script>
		<script>
			const game = new Game({
				level: 2,
				gridSize: 16,
				timeLimit: 60,
				imageSource: [
					'img/dog/one.jpg',
					'img/dog/one.jpg',
					'img/dog/two.jpg',
					'img/dog/two.jpg',
					'img/dog/three.jpg',
					'img/dog/three.jpg',
					'img/dog/four.jpg',
					'img/dog/four.jpg',
					'img/dog/five.jpg',
					'img/dog/five.jpg',
					'img/dog/six.jpg',
					'img/dog/six.jpg',
					'img/dog/seven.jpg',
					'img/dog/seven.jpg',
					'img/dog/eight.jpg',
					'img/dog/eight.jpg',
				],
				containerSelector: '#game-grid',
				scoreDisplaySelector: '#score',
				timerDisplaySelector: '#timer',
				statusDisplaySelector: '#status',
			});

			window.game = game;
		</script>
	</body>
</html>

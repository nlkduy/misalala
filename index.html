<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="MISALALA - A fun and challenging photo matching memory game with 3 levels of difficulty. Match images to test your memory and improve your score.">
		<meta name="author" content="DiLabs">
		<title>MISALALA - A photo matching game.</title>
		<link href="style/Game.css" rel="stylesheet" type="text/css">
		<link rel="icon" href="favicon.png" type="image/gif">
	</head>

	<body class="home-page">
		<main class="game-main">
			<div class="home-container">
				<div class="text-panel">
					<h2 class="misalala-logo-text"><img src="favicon.png" alt="favicon" class="favicon-logo">MISALALA</h2>

					<nav class="level-selector">
					<a href="game.html?level=1" class="level-link" title="Level 1 - Easy">
						<img src="img/cat.jpg" alt="Level 1">
						<span>Level 1 (3x3)</span>
					</a>
					<a href="game.html?level=2" class="level-link" title="Level 2 - Medium">
						<img src="img/dog.jpg" alt="Level 2">
						<span>Level 2 (4x4)</span>
					</a>
					<a href="game.html?level=3" class="level-link" title="Level 3 - Hard">
						<img src="img/baby.jpg" alt="Level 3">
						<span>Level 3 (6x6)</span>
					</a>
				</nav>

				<a href="game.html?level=1" class="play-button-link">
					<button class="play-button-text">Play Now &rarr;</button>
				</a>

				</div>
			</div>
		</main>

		<footer class="home-footer">
			<p>&copy; 2017-2026 by DiLabs | <b>Version 1.2</b></p>
		</footer>

		<script>
			document.addEventListener('DOMContentLoaded', () => {
				// Disable levels if previous not completed
				const levelLinks = document.querySelectorAll('.level-link');
				levelLinks.forEach(link => {
					const href = link.getAttribute('href');
					const match = href.match(/level=(\d+)/);
					if (match) {
						const levelNum = parseInt(match[1]);
						if (levelNum > 1 && !localStorage.getItem(`level_${levelNum - 1}_completed`)) {
							link.classList.add('disabled');
						}
					}
				});
			});
		</script>
	</body>
</html>

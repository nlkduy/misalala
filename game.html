<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>MISALALA - Level 1</title>
		<link rel="stylesheet" href="style/level.css" type="text/css">
		<link rel="icon" href="favicon.png" type="image/gif">
	</head>

	<body class="game-page">
		<header class="game-header">
			<div class="header-brand">
				<a href="index.html" class="misalala-logo-text"><img src="favicon.png" alt="MISALALA logo" class="favicon-logo">MISALALA</a>
				<div class="level-badge"><span id="level">Level 1</span></div>
			</div>
			<div class="header-stats">
				<div class="stat"><span>Time</span><strong id="timer">30s</strong></div>
				<div class="stat"><span>Score</span><strong id="score">0</strong></div>
			</div>
		</header>

		<main class="game-main">
			<section class="game-container" id="game-container">
				<div class="game-area">
					<div id="game-grid" class="game-grid"></div>
				</div>
				<div class="game-controls-overlay" id="game-controls-overlay">
					<div class="game-controls-modal">
						<div id="status" class="game-status"></div>
						<button id="playagain" class="btn-play-again">Play Again</button>
					</div>
				</div>
			</section>
		</main>

		<div id="end-screen" class="end-screen-overlay">
			<div class="end-screen-modal">
				<h1>Game Complete!</h1>
				<p>Your final score: <span id="final-score"></span></p>
				<p>Redirecting to main page...</p>
			</div>
		</div>

		<div id="score-popup"></div>

		<footer class="game-footer">
			<p>&copy; 2017-2026 by DiLabs | <b>Version 1.2</b></p>
		</footer>

		<script src="script/Game.js"></script>
		<script>
			const urlParams = new URLSearchParams(window.location.search);
			const level = urlParams.get('level') || '1';
			let hasAccess = true;
			// Check level access
			if (level !== '1' && level !== 'end') {
				const levelNum = parseInt(level);
				const prevLevel = levelNum - 1;
				if (!localStorage.getItem(`level_${prevLevel}_completed`)) {
					alert(`You must complete Level ${prevLevel} first!`);
					window.location.href = 'index.html';
					hasAccess = false;
				}
			}
			if (!hasAccess) {
				// Access denied; stop running game logic
			} else if (level === 'end') {
				document.getElementById('game-container').style.display = 'none';
			document.getElementById('end-screen').classList.add('active');
				const score = sessionStorage.getItem('record') || 0;
				document.getElementById('final-score').textContent = score;
				setTimeout(() => window.location.href = 'index.html', 5000);
			} else {
				const levelNum = parseInt(level);
				document.title = `MISALALA - Level ${level}`;
				document.getElementById('level').textContent = `Level ${level}`;
				document.getElementById('game-container').classList.add(`level-${level}`);

				const imageSources = {
					1: [
						'img/cat/one.jpg', 'img/cat/one.jpg',
						'img/cat/two.jpg', 'img/cat/two.jpg',
						'img/cat/three.jpg', 'img/cat/three.jpg',
						'img/cat/four.jpg', 'img/cat/four.jpg',
						'img/cat/lucky.jpg',
					],
					2: [
						'img/dog/one.jpg', 'img/dog/one.jpg',
						'img/dog/two.jpg', 'img/dog/two.jpg',
						'img/dog/three.jpg', 'img/dog/three.jpg',
						'img/dog/four.jpg', 'img/dog/four.jpg',
						'img/dog/five.jpg', 'img/dog/five.jpg',
						'img/dog/six.jpg', 'img/dog/six.jpg',
						'img/dog/seven.jpg', 'img/dog/seven.jpg',
						'img/dog/eight.jpg', 'img/dog/eight.jpg',
					],
					3: Array.from({length: 36}, (_, i) => `img/baby/${Math.floor(i/2)+1}.jpg`)
				};

				const configs = {
					1: { gridSize: 9, timeLimit: 30 },
					2: { gridSize: 16, timeLimit: 60 },
					3: { gridSize: 36, timeLimit: 120 }
				};

				const config = {
					level: levelNum,
					...configs[levelNum],
					imageSource: imageSources[levelNum],
					containerSelector: '#game-grid',
					scoreDisplaySelector: '#score',
					timerDisplaySelector: '#timer',
					statusDisplaySelector: '#status',
				};

				document.getElementById('timer').textContent = `${config.timeLimit}s`;

				const game = new Game(config);
				window.game = game;
			}
		</script>
	</body>
</html>

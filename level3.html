<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>MisaLala - Level 3</title>
		<link rel="stylesheet" href="style/level.css" type="text/css">
		<link rel="icon" href="facvicon.png" type="image/gif">
	</head>

	<body>
		<div class="game-container level-3">
			<aside class="reference-images">
				<h3>Reference Images</h3>
				<div class="reference-grid">
					<img src="img/total/1.jpg" alt="Reference 1" class="reference-img">
					<img src="img/total/2.jpg" alt="Reference 2" class="reference-img">
					<img src="img/total/3.jpg" alt="Reference 3" class="reference-img">
					<img src="img/total/4.jpg" alt="Reference 4" class="reference-img">
					<img src="img/total/5.jpg" alt="Reference 5" class="reference-img">
					<img src="img/total/6.jpg" alt="Reference 6" class="reference-img">
					<img src="img/total/7.jpg" alt="Reference 7" class="reference-img">
					<img src="img/total/8.jpg" alt="Reference 8" class="reference-img">
					<img src="img/total/9.jpg" alt="Reference 9" class="reference-img">
					<img src="img/total/10.jpg" alt="Reference 10" class="reference-img">
					<img src="img/total/11.jpg" alt="Reference 11" class="reference-img">
					<img src="img/total/12.jpg" alt="Reference 12" class="reference-img">
					<img src="img/total/13.jpg" alt="Reference 13" class="reference-img">
					<img src="img/total/14.jpg" alt="Reference 14" class="reference-img">
					<img src="img/total/15.jpg" alt="Reference 15" class="reference-img">
					<img src="img/total/16.jpg" alt="Reference 16" class="reference-img">
					<img src="img/total/17.jpg" alt="Reference 17" class="reference-img">
					<img src="img/total/18.jpg" alt="Reference 18" class="reference-img">
				</div>
			</aside>

			<main class="game-area">
				<div id="game-grid" class="game-grid"></div>
			</main>

			<aside class="game-stats">
				<div class="logo-container">
					<a href="index.html" class="misalala-logo-text">MISALALA</a>
				</div>
				<h2 id="level">Level 3</h2>
				<div class="divider"></div>
				<div class="stat">
					<span class="stat-label">Time:</span>
					<span class="stat-value" id="timer">120s</span>
				</div>
				<div class="stat">
					<span class="stat-label">Score:</span>
					<span class="stat-value" id="score">0</span>
				</div>
				<div id="status" class="game-status"></div>
				<button id="playagain" class="btn-play-again">Play Again</button>
				<footer class="game-footer">
					<p>&copy; 2017-2026 by DuyNLK</p>
				</footer>
			</aside>
		</div>

		<div id="score-popup"></div>

		<script src="script/Game.js"></script>
		<script>
			const game = new Game({
				level: 3,
				gridSize: 36,
				timeLimit: 120,
				imageSource: [
					'img/total/1.jpg', 'img/total/1.jpg',
					'img/total/2.jpg', 'img/total/2.jpg',
					'img/total/3.jpg', 'img/total/3.jpg',
					'img/total/4.jpg', 'img/total/4.jpg',
					'img/total/5.jpg', 'img/total/5.jpg',
					'img/total/6.jpg', 'img/total/6.jpg',
					'img/total/7.jpg', 'img/total/7.jpg',
					'img/total/8.jpg', 'img/total/8.jpg',
					'img/total/9.jpg', 'img/total/9.jpg',
					'img/total/10.jpg', 'img/total/10.jpg',
					'img/total/11.jpg', 'img/total/11.jpg',
					'img/total/12.jpg', 'img/total/12.jpg',
					'img/total/13.jpg', 'img/total/13.jpg',
					'img/total/14.jpg', 'img/total/14.jpg',
					'img/total/15.jpg', 'img/total/15.jpg',
					'img/total/16.jpg', 'img/total/16.jpg',
					'img/total/17.jpg', 'img/total/17.jpg',
					'img/total/18.jpg', 'img/total/18.jpg',
				],
				containerSelector: '#game-grid',
				scoreDisplaySelector: '#score',
				timerDisplaySelector: '#timer',
				statusDisplaySelector: '#status',
			});

			window.game = game;
		</script>
	</body>
</html>
